# Tout est préfixé "coloc" et isolé : réseau, dossier de données, conteneur et port dédiés.
# Ne touche à rien d'autre sur la machine.
name: coloc

services:
  app:
    build: .
    image: coloc:local
    container_name: coloc-app
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Paris
    # Uniquement en loopback : le reverse proxy (ou rien du tout) décide de l'exposition.
    ports:
      - "127.0.0.1:${COLOC_PORT:-8321}:8000"
    # Données (SQLite) dans ./data du projet : sauvegarde = copier coloc.db.
    # Le conteneur tourne avec l'uid de l'utilisateur pour pouvoir y écrire
    # (COLOC_UID/COLOC_GID sont exportés par scripts/_common.sh).
    user: "${COLOC_UID:-1000}:${COLOC_GID:-1000}"
    volumes:
      - ./data:/data
    networks:
      - coloc_net
    # Limites pour ne jamais gêner les autres projets du serveur.
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  coloc_net:
    name: coloc_net
